<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="Swim caps and goggles floating and sinking in a pool">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fc4e8"/>
      <stop offset="1" stop-color="#0a4f8a"/>
    </linearGradient>
    <style>
      .w1 { animation: drift 9s linear infinite; }
      .w2 { animation: drift 6s linear infinite reverse; }
      .w3 { animation: drift 12s linear infinite; }
      .b  { animation: rise 6s ease-in infinite; }
      .drift1 { animation: across 26s linear infinite; }
      .drift2 { animation: across 34s linear infinite; animation-delay: -12s; }
      .drift3 { animation: across 30s linear infinite; animation-delay: -22s; }
      .bob  { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sink { animation: sink 9s ease-in infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
      @keyframes rise  { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .8; } 100% { transform: translateY(-190px); opacity: 0; } }
      @keyframes across { from { transform: translateX(-80px); } to { transform: translateX(1280px); } }
      @keyframes bob   { 0%, 100% { transform: translateY(0) rotate(-7deg); } 50% { transform: translateY(6px) rotate(7deg); } }
      @keyframes sink  { 0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
                         10% { opacity: 1; }
                         85% { transform: translate(18px, 170px) rotate(35deg); opacity: 1; }
                         100% { transform: translate(18px, 170px) rotate(35deg); opacity: 0; } }
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#water)"/>

  <!-- waves (each path is 1800 wide and repeats every 600 px so the drift loops seamlessly) -->
  <g class="w3" opacity=".25">
    <path fill="#ffffff" d="M0 70 Q150 40 300 70 T600 70 T900 70 T1200 70 T1500 70 T1800 70 V0 H0 Z"/>
  </g>
  <g class="w2" opacity=".35">
    <path fill="#ffffff" d="M0 55 Q150 85 300 55 T600 55 T900 55 T1200 55 T1500 55 T1800 55 V0 H0 Z"/>
  </g>
  <g class="w1" opacity=".55">
    <path fill="#e8fbff" d="M0 40 Q150 15 300 40 T600 40 T900 40 T1200 40 T1500 40 T1800 40 V0 H0 Z"/>
  </g>

  <!-- caps and goggles floating at the surface and sinking to the floor -->
  <g class="drift1"><g transform="translate(0 78)"><g class="bob"><path d="M-24 6 A24 21 0 0 1 24 6 Z" fill="#e63946"/><path d="M-24 6 H24" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/><path d="M-12 -8 Q0 -14 12 -8" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" fill="none"/></g></g></g>
  <g class="drift2"><g transform="translate(0 84)"><g class="bob" style="animation-delay:-1.2s"><path d="M-30 0 Q-38 -10 -44 -2" stroke="#2a2a2a" stroke-width="3" fill="none"/><path d="M30 0 Q38 -10 44 -2" stroke="#2a2a2a" stroke-width="3" fill="none"/><ellipse cx="-14" cy="0" rx="13" ry="8" fill="#1d3557" stroke="#a8dadc" stroke-width="2.5"/><ellipse cx="14" cy="0" rx="13" ry="8" fill="#1d3557" stroke="#a8dadc" stroke-width="2.5"/><path d="M-2 0 H2" stroke="#a8dadc" stroke-width="3"/><ellipse cx="-18" cy="-3" rx="4" ry="2" fill="#ffffff" opacity=".5"/><ellipse cx="10" cy="-3" rx="4" ry="2" fill="#ffffff" opacity=".5"/></g></g></g>
  <g class="drift3"><g transform="translate(0 80)"><g class="bob" style="animation-delay:-.6s"><path d="M-24 6 A24 21 0 0 1 24 6 Z" fill="#f4a261"/><path d="M-24 6 H24" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/><path d="M-12 -8 Q0 -14 12 -8" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" fill="none"/></g></g></g>
  <g transform="translate(90 70)"><g class="sink"><path d="M-24 6 A24 21 0 0 1 24 6 Z" fill="#2a9d8f"/><path d="M-24 6 H24" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/><path d="M-12 -8 Q0 -14 12 -8" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" fill="none"/></g></g>
  <g transform="translate(1105 70)"><g class="sink" style="animation-delay:-4s"><path d="M-30 0 Q-38 -10 -44 -2" stroke="#2a2a2a" stroke-width="3" fill="none"/><path d="M30 0 Q38 -10 44 -2" stroke="#2a2a2a" stroke-width="3" fill="none"/><ellipse cx="-14" cy="0" rx="13" ry="8" fill="#1d3557" stroke="#a8dadc" stroke-width="2.5"/><ellipse cx="14" cy="0" rx="13" ry="8" fill="#1d3557" stroke="#a8dadc" stroke-width="2.5"/><path d="M-2 0 H2" stroke="#a8dadc" stroke-width="3"/><ellipse cx="-18" cy="-3" rx="4" ry="2" fill="#ffffff" opacity=".5"/><ellipse cx="10" cy="-3" rx="4" ry="2" fill="#ffffff" opacity=".5"/></g></g>

  <!-- bubbles -->
  <g fill="#ffffff">
    <circle class="b" cx="140" cy="290" r="5" style="animation-delay:0s"/>
    <circle class="b" cx="320" cy="295" r="3" style="animation-delay:1.5s"/>
    <circle class="b" cx="510" cy="292" r="6" style="animation-delay:3s"/>
    <circle class="b" cx="760" cy="296" r="4" style="animation-delay:.8s"/>
    <circle class="b" cx="930" cy="290" r="5" style="animation-delay:2.2s"/>
    <circle class="b" cx="1090" cy="294" r="3" style="animation-delay:4s"/>
  </g>

  <!-- pool floor tiles -->
  <g stroke="#ffffff" stroke-opacity=".18" stroke-width="2">
    <line x1="0" y1="268" x2="1200" y2="268"/>
    <line x1="100" y1="268" x2="60" y2="300"/><line x1="300" y1="268" x2="280" y2="300"/>
    <line x1="500" y1="268" x2="495" y2="300"/><line x1="700" y1="268" x2="705" y2="300"/>
    <line x1="900" y1="268" x2="920" y2="300"/><line x1="1100" y1="268" x2="1140" y2="300"/>
  </g>

  <text x="600" y="200" text-anchor="middle" font-size="44" font-weight="700" fill="#ffffff">Underwater Swim Cap &amp; Goggles Detection</text>
  <text x="600" y="240" text-anchor="middle" font-size="22" fill="#d9f6ff">GoPro HERO13 · Raspberry Pi Zero 2 W · YOLOv8n on Jetson Nano (TensorRT)</text>
</svg>
